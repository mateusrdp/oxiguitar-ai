[package]
name = "oxiguitar-ai-plugin"
description = "The OxiGuitar AI plugin: a chat with a language model, local or hosted, that reads and writes the score and runs OxiGuitar's tools."
version = "0.0.0"
edition = "2024"
# Rust from rustup, raised only when something needs it (CONTRIBUTING.md).
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Mateus Rocha de Paula", "The OxiGuitar contributors"]
repository = "https://github.com/mateusrdp/oxiguitar-ai"
homepage = "https://github.com/mateusrdp/oxiguitar-ai"
publish = false

[lib]
# An ordinary library for tests, and ai.oxp when built with
# `--features oxp --crate-type cdylib` (build-oxp.sh).
crate-type = ["lib"]

[features]
oxp = []

[dependencies]
# The SDK, from the tag of OxiGuitar's repository that has interface 1.14.
# Nothing of OxiGuitar's is on crates.io.
oxiguitar-plugin = { git = "https://github.com/mateusrdp/oxiguitar", tag = "v0.21.5" }
serde = { version = "1", features = ["derive"] }
# HTTP to the model's server (the OpenAI chat completions protocol). Pure
# Rust but for TLS's cryptography: rustls with ring, the mature provider
# (the pure-Rust ones are experimental), and Mozilla's root certificates
# built in (webpki-roots). A server on this computer needs no TLS.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
# The contract suite (tests/contract.rs) runs the built .oxp file through
# OxiGuitar's own plugin host.
oxiguitar-plugin-test = { git = "https://github.com/mateusrdp/oxiguitar", tag = "v0.21.5" }
oxiguitar-host = { git = "https://github.com/mateusrdp/oxiguitar", tag = "v0.21.5" }

# Plugins deny `unsafe` rather than forbid it: `export_plugin!` allows it on
# the two attributes it generates, and nowhere else.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
# Small files. Keep the default `panic = "unwind"`: a panic is then caught
# and reported as an error instead of closing OxiGuitar.
lto = "thin"
codegen-units = 1
strip = "symbols"

# Its own workspace, wherever the folder is copied.
[workspace]
